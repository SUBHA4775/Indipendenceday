<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>স্বাধীনতা দিবসের শুভেচ্ছা</title>
<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    background: linear-gradient(#FF9933, white, #138808);
    padding:50px;
}
.box{
    background:white;
    padding:20px;
    border-radius:15px;
    max-width:700px;
    margin:auto;
    box-shadow:0 0 10px gray;
}
h1{color:#FF6600;}
h2{color:#138808;}
</style>
</head>
<body>
<div class="box">
<h1>🇮🇳 ৭৯তম স্বাধীনতা দিবসের শুভেচ্ছা 🇮🇳</h1>

<p>
যাঁদের ত্যাগ ও আত্মবলিদানের বিনিময়ে আমরা স্বাধীনতা পেয়েছি,
সেই সকল স্বাধীনতা সংগ্রামীদের প্রতি গভীর শ্রদ্ধা।
</p>

<h2>জয় হিন্দ! বন্দে মাতরম!</h2>

<p>
ভারত মাতার গৌরব অক্ষুণ্ণ থাকুক,
দেশপ্রেম ও ঐক্যের বন্ধন আরও দৃঢ় হোক।
</p>
</div>
</body>
</html>
